
name: ChurnOps CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run API tests
        run: |
          pytest tests/ -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build Docker image for integration testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: churnops-api:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Start API container
        run: |
          docker run -d \
            --name churnops-api-test \
            -p 8000:8000 \
            churnops-api:test

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "API is healthy."
              exit 0
            fi

            echo "Waiting for API startup..."
            sleep 2
          done

          echo "API failed to become healthy."
          docker logs churnops-api-test
          exit 1

      - name: Test live prediction endpoint
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "gender": "Female",
              "SeniorCitizen": 0,
              "Partner": "Yes",
              "Dependents": "No",
              "tenure": 12,
              "PhoneService": "Yes",
              "MultipleLines": "No",
              "InternetService": "Fiber optic",
              "OnlineSecurity": "No",
              "OnlineBackup": "Yes",
              "DeviceProtection": "No",
              "TechSupport": "No",
              "StreamingTV": "Yes",
              "StreamingMovies": "No",
              "Contract": "Month-to-month",
              "PaperlessBilling": "Yes",
              "PaymentMethod": "Electronic check",
              "MonthlyCharges": 85.5,
              "TotalCharges": 1026.0
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | python -c '
          import json
          import sys

          result = json.load(sys.stdin)

          assert result["predicted_churn"] in ["Yes", "No"]
          assert 0 <= result["churn_probability"] <= 1
          assert result["classification_threshold"] == 0.54
          assert result["model_name"] == "ChurnOps-Churn-Predictor"
          assert result["model_version"] == "2"

          print("Live prediction integration test passed.")
          '

      - name: Stop test container
        if: always()
        run: |
          docker rm -f churnops-api-test || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy image to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          IMAGE_TAG="sha-$(git rev-parse --short=7 HEAD)"
          IMAGE_URL="ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"
          ENCODED_IMAGE_URL=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE_URL")
          curl --fail --show-error --silent --request POST "${RENDER_DEPLOY_HOOK}&imgURL=${ENCODED_IMAGE_URL}"
